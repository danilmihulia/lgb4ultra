<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<title>My Home</title>
<style>
  :root { --accent:#e11d2a; --gap:18px; --cols:6; --card:#40424a; --card2:#34363d; --rad:16px;
    --ease:cubic-bezier(.22,.61,.24,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#070708; color:#fff;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  body { background:transparent; } /* фон дає html (canvas); інакше body перекриває #lava з z-index:-1 */
  /* «лавова лампа»: м'які плями повільно пливуть по колу. Анімується лише transform (GPU-композитор, без blur/перемальовки) */
  #lava { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  /* маленькі текстури (у 4 рази менші), GPU розтягує їх scale(~4): градієнт гладкий, відеопам'яті ~16x менше; без rotate (давав биті тайли) */
  /* рух — з JS ~8 кадрів/с (не CSS 60fps: композитинг на кожен кадр їв ~70% CPU) */
  #lava .blob { position:absolute; left:0; top:0; border-radius:50%; will-change:transform; transform-origin:50% 50%; }
  #lava .b1 { width:325px; height:175px; background:radial-gradient(closest-side, rgba(32,32,46,.75), rgba(32,32,46,0)); }
  #lava .b2 { width:225px; height:225px; background:radial-gradient(closest-side, rgba(28,30,48,.6),  rgba(28,30,48,0)); }
  #lava .b3 { width:275px; height:130px; background:radial-gradient(closest-side, rgba(36,28,44,.55), rgba(36,28,44,0)); }
  #lava .b4 { width:175px; height:250px; background:radial-gradient(closest-side, rgba(24,34,40,.5),  rgba(24,34,40,0)); }
  /* бічні відступи контенту ~2% (друга лінія); верт. відступи мінімальні */
  .page { padding:32px 40px 28px; height:100%; display:flex; flex-direction:column; }
  header { position:relative; display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; flex:0 0 auto; }
  .hleft { flex:0 0 auto; }
  .hcenter { position:absolute; left:50%; top:2px; transform:translateX(-50%); }
  .searchbar { width:100%; max-width:700px; height:56px; border-radius:28px; display:flex; align-items:center; gap:14px; padding:0 26px; cursor:pointer;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12); color:#8a8a93;
    transition:background .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
  .searchbar .sicon { display:flex; } .searchbar .sicon svg { width:26px; height:26px; }
  .searchbar .sph { font-size:22px; font-weight:500; }
  .searchbar.focus, .searchbar:hover { background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.85); color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.45); transform:scale(1.015); }
  .clock { font-size:68px; font-weight:200; line-height:1; font-variant-numeric:tabular-nums; }
  .date { font-size:21px; color:#8a8a93; margin-top:8px; text-transform:capitalize; }
  .topright { display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
  .icons { display:flex; gap:12px; }
  .ico { display:flex; align-items:center; justify-content:center; width:60px; height:60px; border-radius:15px;
    background:#17171d; color:#cfcfd6; cursor:pointer;
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), color .18s var(--ease); }
  .ico svg { width:28px; height:28px; }
  .ico.focus { transform:scale(1.08); background:#23232c; color:#fff; box-shadow:0 0 0 3px #fff, 0 12px 30px rgba(0,0,0,.5); z-index:2; }
  .sysinfo { text-align:right; color:#55555d; font-size:15px; line-height:1.45; }
  .sysinfo .model { color:#9a9aa2; font-size:17px; font-weight:600; }

  /* overflow:hidden клипає рядок, тому даємо «повітря» (padding) під рамку виділення,
     а negative margin тягне контейнер до країв екрана (стрілки на 1-й лінії = 0%). */
  .mainwrap { position:relative; overflow:hidden; margin:-16px -40px 8px; padding:16px 40px; flex:0 0 auto; }
  .main { display:flex; gap:16px; transition:transform .25s var(--ease); will-change:transform; }
  .mchev { position:absolute; top:16px; height:112px; width:56px; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:4; font-size:38px; font-weight:700; color:#fff; }
  .mchev.left { left:0; background:linear-gradient(90deg, rgba(7,7,8,.92), rgba(7,7,8,0)); }
  .mchev.right { right:0; background:linear-gradient(270deg, rgba(7,7,8,.92), rgba(7,7,8,0)); }
  .mchev.show { display:flex; }
  .mbtn { position:relative; width:293px; flex:0 0 293px; height:112px; border-radius:var(--rad); cursor:pointer; overflow:hidden;
    background:#17171d; /* як іконки кластера вгорі справа */
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:0 12px; color:#fff; font-size:21px; font-weight:700; text-align:center;
    transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
  .mbtn .mi { width:56px; height:56px; border-radius:13px; object-fit:cover; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .mbtn .mi svg { width:44px; height:44px; }
  .mbtn span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .mbtn.focus { background:#23232c; transform:scale(1.035); box-shadow:0 0 0 4px #fff, 0 10px 26px rgba(0,0,0,.55); z-index:2; }

  /* ---- строка табов-категорий ---- */
  .tabs { display:flex; gap:12px; margin:0 0 18px; flex:0 0 auto; align-items:center; flex-wrap:wrap; justify-content:center; }
  .tab { position:relative; padding:11px 24px; border-radius:24px; cursor:pointer; font-size:20px; font-weight:600; color:#b9b9c2;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); white-space:nowrap;
    transition:transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease), color .16s var(--ease); }
  .tab.active { color:#fff; background:rgba(255,255,255,.14); }
  .tab.focus { color:#fff; transform:scale(1.07); background:rgba(255,255,255,.17); box-shadow:0 0 0 3px #fff, 0 8px 22px rgba(0,0,0,.5); z-index:2; }
  .tab.held { box-shadow:0 0 0 3px var(--accent), 0 8px 22px rgba(0,0,0,.6) !important; transform:scale(1.08) !important; color:#fff; z-index:3; }
  .tab.add { color:#8a8a93; font-weight:800; padding:11px 20px; }

  .scroll { flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:12px 18px 30px; margin:-12px -18px 0; }
  .scroll::-webkit-scrollbar { width:0; }
  .grid { display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:var(--gap); align-content:start; }
  .empty { color:#55555d; font-size:22px; padding:40px 4px; }
  .tile { position:relative; height:176px; border-radius:var(--rad); overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; justify-content:flex-end; padding:20px;
    background:#17171d; /* як іконки кластера вгорі справа й кнопки обраного */ transition:transform .18s var(--ease), box-shadow .18s var(--ease); }
  .tile .icon { position:absolute; top:18px; left:20px; width:90px; height:90px; border-radius:18px; object-fit:cover; background:rgba(0,0,0,.25); }
  .tile .glyph { position:absolute; top:18px; left:20px; width:90px; height:90px; border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-size:46px; font-weight:800; background:rgba(255,255,255,.14); }
  .tile .label { font-size:22px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.focus { background:#23232c; transform:scale(1.05); box-shadow:0 0 0 4px #fff, 0 10px 32px rgba(0,0,0,.55); z-index:2; }

  /* тост у стилі системних тостів (хук 37, notif-restyle): темна «пігулка», світлий текст, тонка обвідка */
  .toast { position:fixed; left:50%; bottom:45px; transform:translateX(-50%) translateY(40px);
    background:rgba(22,22,28,.97); color:#e6e6e6; border:1px solid rgba(255,255,255,.18); padding:20px 40px; min-width:900px; max-width:1500px; text-align:center; border-radius:60px; font-size:27px; font-weight:600; box-shadow:0 12px 40px rgba(0,0,0,.6); opacity:0; transition:.25s; z-index:9000; } /* над налаштуваннями/пошуком/модалками (30/20), під заставкою (9999) */
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .tile.held, .mbtn.held { box-shadow:0 0 0 5px var(--accent), 0 12px 34px rgba(0,0,0,.7) !important; transform:scale(1.06) !important; z-index:3; }
  .ico.held { box-shadow:0 0 0 4px var(--accent), 0 10px 24px rgba(0,0,0,.6) !important; transform:scale(1.12) !important; animation:none !important; z-index:3; color:#fff; }
  .ico.editbtn.on { background:var(--accent); color:#fff; }
  .edithint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); white-space:nowrap; text-align:center; background:var(--accent); color:#fff; padding:10px 24px; border-radius:30px; font-size:18px; font-weight:600; display:none; z-index:6; }
  /* перетягування в «Правці»: «примара» поверх усього (fixed, z 9500), на місці джерела — порожній слот */
  .drag-ghost { position:fixed; left:0; top:0; z-index:9500; pointer-events:none; will-change:transform; }
  .drag-ghost > * { position:relative; box-shadow:0 0 0 4px var(--accent), 0 18px 44px rgba(0,0,0,.7) !important; transform:scale(1.06) !important; transition:transform .15s, opacity .15s; }
  .drag-ghost.small > * { transform:scale(.6) !important; opacity:.55; }
  .drag-src { opacity:0 !important; }
  .drag-shift { transition:transform .18s cubic-bezier(.22,.61,.24,1) !important; }
  .tab.drop-target { color:#fff; background:var(--accent) !important; transform:scale(1.12); box-shadow:0 0 0 3px #fff; }
  body.dragmode, body.dragmode * { cursor:grabbing !important; }
  body.edit .edithint { display:block; }
  body.edit .toast { bottom:80px; }   /* у режимі правки тост над підказкою, не перекриває її */

  /* ---- модальное окно (меню / инфо / ввод) ---- */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:20; }
  .modal.show { display:flex; animation:ovFade .18s ease-out both; }
  .modal.show .modalbox { animation:ovPop .2s cubic-bezier(.22,.61,.24,1) both; }
  /* м'які короткі анімації появи (лише opacity/transform, разові — не навантажують ТВ) */
  @keyframes ovFade { from{opacity:0} to{opacity:1} }
  @keyframes ovPop  { from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none} }
  @keyframes tileIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .grid.swap .tile { animation:tileIn .2s ease-out both; }
  .grid.swap .tile:nth-child(n+7) { animation-delay:.03s; }
  .grid.swap .tile:nth-child(n+13) { animation-delay:.06s; }
  .modalbox { min-width:460px; max-width:720px; background:#1c1d23; border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:26px 26px 22px; box-shadow:0 24px 70px rgba(0,0,0,.7); }
  .mtitle { font-size:25px; font-weight:700; margin-bottom:18px; line-height:1.3; }
  .mtitle small { display:block; font-size:16px; font-weight:400; color:#8a8a93; margin-top:8px; line-height:1.5; }
  .mitem { font-size:22px; font-weight:600; color:#d7d7de; padding:15px 20px; border-radius:13px; cursor:pointer; margin-top:8px;
    transition:transform .14s var(--ease), background .14s var(--ease), color .14s var(--ease), box-shadow .14s var(--ease); }
  .mitem.focus { background:rgba(255,255,255,.14); color:#fff; transform:scale(1.02); box-shadow:0 0 0 2px #fff; }
  .mitem.danger.focus { box-shadow:0 0 0 2px var(--accent); }
  .mitem.dis { color:#55555d; cursor:default; }
  .minput { width:100%; font-size:23px; padding:14px 18px; border-radius:13px; margin-top:6px; background:#0f0f14; color:#fff; border:2px solid rgba(255,255,255,.2); outline:none; }
  .minput:focus { border-color:#fff; }
  /* наша екранна клавіатура */
  .osk { position:fixed; left:50%; bottom:28px; transform:translate(-50%,30px); width:1560px; max-width:calc(100% - 80px); padding:18px; border-radius:26px;
         background:rgba(22,22,28,.98); border:1px solid rgba(255,255,255,.14); box-shadow:0 24px 60px rgba(0,0,0,.7); z-index:60;
         opacity:0; pointer-events:none; transition:opacity .16s ease, transform .2s cubic-bezier(.22,.61,.24,1); }
  .osk.show { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .osk-row { display:flex; gap:10px; margin-top:10px; } .osk-row:first-child { margin-top:0; }
  .osk-key { flex:1 1 0; height:74px; border-radius:14px; background:#2a2a33; color:#eee; font-size:32px; font-weight:500; display:flex; align-items:center; justify-content:center;
             cursor:pointer; transition:transform .1s, background .1s, box-shadow .1s; user-select:none; }
  .osk-key.fn { background:#1d1d24; font-size:24px; color:#cfcfd6; }
  .osk-key.ok { background:var(--accent); color:#fff; }
  .osk-key.on { background:#3b3b48; color:#fff; }
  .osk-key.focus { background:#fff; color:#111; transform:scale(1.07); box-shadow:0 8px 22px rgba(0,0,0,.5); }
  .osk-key.ok.focus { background:#fff; color:var(--accent); }
  body.osk-on .modal { align-items:flex-start; padding-top:110px; }
  body.osk-on .search { padding-bottom:480px; }
  .osk-hint { display:flex; gap:30px; justify-content:center; margin-top:14px; font-size:20px; color:#b9b9c2; }
  .osk-hint span { display:flex; align-items:center; gap:9px; } .osk-hint span.dim { color:#77777f; }
  .osk-hint span.flash { color:#fff; animation:oskfl .7s ease 3; } @keyframes oskfl { 50% { transform:scale(1.18); } }
  .osk-hint i { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .osk-key svg { width:40px; height:28px; flex:0 0 auto; }
  .osk-key.caps { background:#fff; color:#111; }
  .osk-view { position:fixed; z-index:61; pointer-events:none; display:none; align-items:center; overflow:hidden; color:#fff; white-space:pre; box-sizing:border-box; }
  .osk-tx { display:inline-block; white-space:pre; }
  .osk-caret { display:inline-block; width:3px; height:1.15em; background:#fff; vertical-align:middle; margin:0 1px; animation:oskb 1s steps(1) infinite; }
  @keyframes oskb { 50% { opacity:0; } }
  .osk-target { border-color:#fff !important; box-shadow:0 0 0 3px rgba(255,255,255,.25); }

  /* ---- поисковый оверлей ---- */
  .search { position:fixed; inset:0; background:rgba(7,7,8,.97); display:none; z-index:30; padding:70px 120px; }
  .search.show { display:block; animation:ovPop .18s ease-out both; }
  .sbox { max-width:1400px; margin:0 auto; height:100%; display:flex; flex-direction:column; }
  .sinput { width:100%; height:76px; font-size:34px; padding:0 30px; border-radius:18px; background:#15151b; color:#fff; border:2px solid rgba(255,255,255,.2); outline:none; flex:0 0 auto; }
  .sinput:focus { border-color:#fff; }
  .scats { display:flex; gap:14px; margin:26px 0; flex:0 0 auto; flex-wrap:wrap; }
  .scat { padding:12px 26px; border-radius:24px; font-size:21px; font-weight:600; color:#b9b9c2; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); cursor:pointer; transition:transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease), color .15s var(--ease); }
  .scat.active { color:#fff; background:rgba(255,255,255,.14); }
  .scat.focus, .scat.hov { color:#fff; transform:scale(1.07); box-shadow:0 0 0 3px #fff; background:rgba(255,255,255,.17); }
  .sresults { display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1 1 auto; }
  .sresults::-webkit-scrollbar { width:0; }
  .sres { display:flex; align-items:center; gap:18px; padding:16px 22px; border-radius:14px; background:rgba(255,255,255,.05); cursor:pointer; font-size:24px; transition:transform .14s var(--ease), box-shadow .14s var(--ease), background .14s var(--ease); }
  .sres .sico { width:54px; height:54px; border-radius:12px; object-fit:cover; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; flex:0 0 auto; }
  .sres .stext { display:flex; flex-direction:column; min-width:0; }
  .sres .stext > div:first-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sres .ssub { font-size:16px; color:#8a8a93; }
  .sres.focus { background:rgba(255,255,255,.14); transform:scale(1.015); box-shadow:0 0 0 3px #fff; }
  .sempty { color:#55555d; font-size:22px; padding:30px 4px; }

  /* ---- оверлей налаштувань ---- */
  .setov { position:fixed; inset:0; background:rgba(7,7,8,.97); display:none; z-index:30; padding:60px 120px; }
  .setov.show { display:flex; flex-direction:column; animation:ovPop .18s ease-out both; }
  .setbox { width:1200px; max-width:100%; margin:0 auto; height:100%; display:flex; flex-direction:column; }   /* фіксована ширина: вікно не «гуляє» від довжини опису */
  .seth { font-size:40px; font-weight:300; margin-bottom:8px; flex:0 0 auto; }
  .setsub { font-size:17px; color:#8a8a93; margin-bottom:22px; flex:0 0 auto; }
  /* запас під scale(1.01)+обвідку 3px виділеного рядка: інакше overflow обрізає її зверху/збоку */
  .setlist { overflow-y:auto; flex:1 1 auto; padding:10px 20px; margin:0 -20px; scroll-padding:10px 0; }
  .setlist::-webkit-scrollbar { width:0; }
  .setsec { font-size:16px; letter-spacing:1.5px; text-transform:uppercase; color:#55555d; margin:24px 0 10px; }
  .setsec:first-child { margin-top:0; }
  .setrow { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 22px; border-radius:14px; background:rgba(255,255,255,.05); margin-bottom:8px;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), background .14s var(--ease); cursor:pointer; }
  .setrow .setlabel { font-size:23px; }
  .setrow .setdesc { display:none; font-size:18px; opacity:.6; margin-top:4px; max-width:1000px; line-height:1.35; white-space:normal; }
  .setrow.focus .setdesc, .setlist.descall .setrow .setdesc { display:block; }   /* опис у виділеного пункту (або в усіх — «Опис: Усі») */
  .setdim { font-size:17px; color:#8a8a93; margin:0 4px 12px; }
  .setrow .setnote { font-size:15px; color:#8a8a93; margin-top:3px; }
  .setsec { font-size:17px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#8a8a93; margin:22px 6px 10px; }
  .setsec:first-child { margin-top:4px; }
  .setmore .setlabel { color:#b9b9c2; }
  .setrow.focus { background:rgba(255,255,255,.14); transform:scale(1.01); box-shadow:0 0 0 3px #fff; }
  .setpill { flex:0 0 auto; min-width:92px; text-align:center; padding:9px 20px; border-radius:22px; font-size:19px; font-weight:700; }
  .setpill.on { background:#1ec15f; color:#06230f; }
  .setpill.off { background:rgba(255,255,255,.12); color:#9a9aa2; }
  .setpill.val { background:rgba(80,140,255,.22); color:#cfe0ff; min-width:110px; }
  .setpicker { position:absolute; inset:0; background:rgba(7,7,8,.92); display:none; align-items:center; justify-content:center; z-index:5; }
  .setpicker.show { display:flex; }
  .spbox { min-width:440px; max-width:640px; max-height:82%; overflow-y:auto; background:#1c1d23; border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:26px; box-shadow:0 24px 70px rgba(0,0,0,.7); }
  .spbox::-webkit-scrollbar { width:0; }
  .sptitle { font-size:26px; font-weight:700; margin-bottom:6px; }
  .sphint { font-size:15px; color:#8a8a93; margin-bottom:16px; }
  .spitem { font-size:23px; padding:13px 20px; border-radius:12px; margin-top:7px; color:#d7d7de; cursor:pointer; }
  .spitem.focus { background:rgba(255,255,255,.16); color:#fff; box-shadow:0 0 0 2px #fff; }
  .spnum { font-size:64px; font-weight:300; text-align:center; padding:22px 0; font-variant-numeric:tabular-nums; min-width:150px; }
  .spitem.cur::after { content:''; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-left:12px; vertical-align:middle; }
  .sprow { display:flex; align-items:center; justify-content:center; gap:22px; }
  .tfrow { display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .tfval { display:flex; align-items:center; gap:14px; color:#fff; }

  // ---- мова інтерфейсу (налаштування «Хаб» → Мова). Ключі словника = український текст; L(s) = переклад або s.
  // Файли перекладів: i18n/<мова>.json поруч (джерело — i18n/hub/ у проєкті). Спільне значення для наших застосунків:
  // settings category "myhome", key "uiLang"; мова системи LG змінюється разом із нею (localeInfo.locales.UI).
  var LANGS=[['uk','Українська','uk-UA'],['ru','Русский','ru-RU'],['en','English','en-GB'],['nl','Nederlands','nl-NL'],['de','Deutsch','de-DE'],
             ['fr','Français','fr-FR'],['es','Español','es-ES'],['it','Italiano','it-IT'],['pl','Polski','pl-PL'],['pt','Português','pt-PT']];
  var UILANG=(function(){ try{ return localStorage.getItem('uiLang')||'uk'; }catch(e){ return 'uk'; } })(), DICT=null;
  if(UILANG!=='uk'){ try{ var lx=new XMLHttpRequest(); lx.open('GET','i18n/'+UILANG+'.json',false); lx.send(); if(lx.responseText) DICT=JSON.parse(lx.responseText); }catch(e){ DICT=null; } }
  function L(s){ return (DICT && DICT[s]) || s; }
  // статичний текст розмітки (текстові вузли, placeholder/title) — один раз на старті
  (function(){ if(!DICT) return; document.documentElement.lang=UILANG;
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false), n, list=[];
    while((n=w.nextNode())) list.push(n);
    list.forEach(function(t){ var v=t.nodeValue, k=v.replace(/\s+/g,' ').trim(); if(k && DICT[k]) t.nodeValue=v.replace(k, DICT[k]); });
    [].forEach.call(document.querySelectorAll('[placeholder],[title]'), function(el){ ['placeholder','title'].forEach(function(a){ var v=el.getAttribute(a); if(v && DICT[v.trim()]) el.setAttribute(a, DICT[v.trim()]); }); });
  })();

  // Це НЕ натискання: не повертаємо ними виділення й не рухаємо фокус (баг 2026-11-20: при автоприховуванні курсора

  window.addEventListener('keydown', function(e){
    var k=e.keyCode; if(k!==1536 && k!==1537) return;

    if(k===1536 && window.saverActive && window.hideSaver) window.hideSaver(); else if(k===1536 && window.resetIdle) window.resetIdle();   // 1537 = курсор сам сховався — це не дія

  function handleSearchKey(e){
    var k=e.keyCode;
    if(k===461||k===8||k===27){ closeSearch(); if(e.preventDefault)e.preventDefault(); return; }
    if(sZone==='results' && sFocus<0 && sResults.length){ sFocus=Math.min(lastSFocus, sResults.length-1); markSRes(); if(e.preventDefault)e.preventDefault(); return; }
    if(sZone==='input'){
      if(k===40){ sZone='cats'; try{sinput.blur();}catch(_){} renderSCats(); if(e.preventDefault)e.preventDefault(); }
      else if(k===13){ searchKbd(); if(e.preventDefault)e.preventDefault(); }
      return;   // прочие клавиши — печать в input
    }
    if(sZone==='cats'){
      if(k===37){ sCat=Math.max(0,sCat-1); renderSCats(); runSearch(); }
      else if(k===39){ sCat=Math.min(SEARCH_CATS.length-1,sCat+1); renderSCats(); runSearch(); }
      else if(k===38){ searchKbd(); }
      else if(k===40||k===13){ sZone='results'; sFocus=0; markSRes(); }
      if(e.preventDefault)e.preventDefault(); return;
    }
    if(sZone==='results'){
      if(k===38){ if(sFocus<=0){ sZone='cats'; renderSCats(); } else { sFocus--; markSRes(); } }
      else if(k===40){ sFocus=Math.min(sResults.length-1,sFocus+1); markSRes(); }
      else if(k===37){ sCat=Math.max(0,sCat-1); renderSCats(); runSearch(); }
      else if(k===39){ sCat=Math.min(SEARCH_CATS.length-1,sCat+1); renderSCats(); runSearch(); }
      else if(k===13){ if(sResults[sFocus]&&sResults[sFocus].act) sResults[sFocus].act(); }
      if(e.preventDefault)e.preventDefault(); return;
    }
  }

  function openModal(titleHtml, items){
    if(!modalOpen && window.uiSnd) uiSnd.play('open'); modalOpen=true; modalItems=items||[]; modalInput=null;
    modalbox.innerHTML='<div class="mtitle">'+titleHtml+'</div>';

      d.className='mitem'+(it.dis?' dis':'')+(it.danger?' danger':'')+(it.info?' info':'');

      if(e.keyCode===13){ e.stopPropagation(); if(e.preventDefault)e.preventDefault(); var v=inp.value; closeModal(); onok(v); }
      else if(e.keyCode===461||e.keyCode===27){ e.stopPropagation(); if(e.preventDefault)e.preventDefault(); closeModal(); }

  // картинка в LG зберігається окремо для кожного входу й режиму: показуємо у вкладці, для чого саме ці значення
  var picDim=null;
  // it.xp = extra request params (truMotionMode is only found with app_id); it.sub = one field of an object setting
  // (option/adjustments = {blackAndWhite, colorInversion}: written back whole, it.excl = field that must go off)
  function sParams(it, extra){ var p={category:it.cat}, k; if(it.xp) for(k in it.xp) p[k]=it.xp[k]; for(k in extra) p[k]=extra[k]; return p; }
  function sTake(it, st){ if(!(it.key in st)) return; var v=st[it.key]; if(it.sub){ it._obj=v; it._val=v&&v[it.sub]; } else it._val=v; }
  function sPayload(it, val){ var o={}; if(!it.sub){ o[it.key]=val; return o; } var cur=it._obj||{}, n={}, k; for(k in cur) n[k]=cur[k]; n[it.sub]=val; if(val==='on' && it.excl) n[it.excl]='off'; o[it.key]=n; return o; }
  function verifySiblings(it){ SETTINGS_CATS.forEach(function(s){ s.items.forEach(function(x){ if(x!==it && x.cat===it.cat && x.key===it.key) verifySetting(x); }); }); }
  function picDimText(){ var d=picDim; if(!d) return '';
    var inp=String(d.input||''), m=/^hdmi(\d)/.exec(inp);
    var t = m ? 'HDMI '+m[1] : (inp==='default' ? L('застосунки') : (/tv$/.test(inp) ? L('ТВ') : inp));
    var pm=null; SETTINGS_CATS.forEach(function(s){ s.items.forEach(function(it){ if(it.key==='pictureMode') pm=it; }); });
    var mode = pm ? sDisp(pm, d.pictureMode) : d.pictureMode;
    return L('Для: ')+t+L(' · режим «')+mode+'»'+(d.dynamicRange && d.dynamicRange!=='sdr' ? ' · '+String(d.dynamicRange).toUpperCase() : '');
  }
  var settingsOpen=false, setCatIdx=0, setFocus=0, setRows=[];
  var setov=document.getElementById('setov'), setlist=document.getElementById('setlist'), settabs=document.getElementById('settabs');
  function sUnwrap(v){ return (v && typeof v==='object' && ('value' in v)) ? v.value : v; }
  function sIsOn(it,v){ v=sUnwrap(v); if(it.onv) return v===it.onv||v==='on'; if(it.t==='bool') return v===true; if(it.t==='truefalse') return v==='true'||v===true; return v==='on'; }
  function sValFor(it,on){ if(it.onv) return on?it.onv:it.offv; if(it.t==='bool') return !!on; if(it.t==='truefalse') return on?'true':'false'; return on?'on':'off'; }
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return (v===null||v==='')?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
  function sDisp(it,v){ v=sUnwrap(v); if(v===undefined) return '…'; if(it.disp){ var i=it.vals.indexOf(String(v)); if(i>=0) return it.disp[i]; } return (v==null?'—':String(v)); }
  // тема хаба (html.light) + спільне значення для наших застосунків: settings category "myhome", key "uiTheme"
  function applyHubTheme(){ var v=lsGet('uiTheme','dark'), h=new Date().getHours(); var light = v==='light' || (v==='auto' && h>=7 && h<20);
    document.documentElement.classList.toggle('light', light); }
  function shareHubTheme(){ luna('luna://com.webos.settingsservice/setSystemSettings', {category:'myhome', settings:{uiTheme:lsGet('uiTheme','dark')}}, function(){}); }
  applyHubTheme(); setInterval(applyHubTheme, 60000); setTimeout(shareHubTheme, 3000);
  setTimeout(function(){ luna('luna://com.webos.settingsservice/setSystemSettings', {category:'myhome', settings:{ uiLang:UILANG }}, function(){}); }, 3500);   // keep myhome/uiLang present (the TV daemon passes it to our apps)
  // мова: спільне значення для наших застосунків + мова системи LG, потім перезапуск хаба з новим словником
  function applyLang(code){
    var l=null; LANGS.forEach(function(x){ if(x[0]===code) l=x; }); if(!l) return;
    luna('luna://com.webos.settingsservice/setSystemSettings', {category:'myhome', settings:{ uiLang:code }}, function(){});
    luna('luna://com.webos.settingsservice/getSystemSettings', {keys:['localeInfo']}, function(r){
      var li=r && r.settings && r.settings.localeInfo;
      if(li && li.locales && li.locales.UI!==l[2]){ li.locales.UI=l[2]; luna('luna://com.webos.settingsservice/setSystemSettings', {settings:{ localeInfo:li }}, function(){}); }
      setTimeout(function(){ location.reload(); }, 600);
    });
  }
  function applyLocalSetting(it){ if(it.key==='uiLang'){ applyLang(lsGet('uiLang','uk')); return; } if(it.key==='descMode' && settingsOpen) renderSettings(); if(it.key==='uiTheme'){ applyHubTheme(); shareHubTheme(); } if(it.local && window.saverApplyCfg) window.saverApplyCfg(); if(it.local && /^uiSound/.test(it.key) && window.uiSnd){ uiSnd.reload(); setTimeout(function(){ uiSnd.play('ok'); },150); } }
  function openSettings(){
    if(!settingsOpen && window.uiSnd) uiSnd.play('open'); settingsOpen=true; setCatIdx=0; setFocus=0; setov.classList.add('show');
    SETTINGS_CATS.forEach(function(s){ s.items.forEach(function(it){ if(it.local) it._val=lsGet(it.key, it.ldef); else it._val=undefined; }); });   // системні — лише свіже значення з ТВ
    renderSettings();
    var byCat={};
    SETTINGS_CATS.forEach(function(s){ s.items.forEach(function(it){ if(it.local||it.special) return; if(it.xp){ verifySetting(it); return; } if((byCat[it.cat]||[]).indexOf(it.key)<0) (byCat[it.cat]=byCat[it.cat]||[]).push(it.key); }); });
    readSleepTimer(); keysLoad();
    var pending=Object.keys(byCat).length;
    Object.keys(byCat).forEach(function(lcat){
      luna('luna://com.webos.settingsservice/getSystemSettings', {category:lcat, keys:byCat[lcat]}, function(r){
        var st=(r&&r.settings)||{};
        if(lcat==='picture' && r && r.dimension) picDim=r.dimension;
        SETTINGS_CATS.forEach(function(s){ s.items.forEach(function(it){ if(it.cat===lcat && !it.xp) sTake(it,st); }); });
        if(--pending<=0) renderSettings();
      });
    });
  }
  function closeSettings(){ if(settingsOpen && window.uiSnd) uiSnd.play('close'); settingsOpen=false; setov.classList.remove('show'); renderAll(); }
  function renderSettabs(){
    settabs.innerHTML='';
    SETTINGS_CATS.forEach(function(s,i){
      var t=document.createElement('div'); t.className='stab'+(i===setCatIdx?' active':''); t.textContent=s.name;
      t.addEventListener('click', function(){ if(setCatIdx!==i){ setCatIdx=i; setFocus=0; } renderSettings(); });
      // як у хабі: наведення курсором підсвічує вкладку (біла обвідка), категорія міняється кліком
      t.addEventListener('mouseenter', function(){ t.classList.add('hov'); });
      t.addEventListener('mouseleave', function(){ t.classList.remove('hov'); });
      settabs.appendChild(t);
    });
  }
  function descMode(){ return lsGet('descMode','focus'); }   // off | focus | all (раніше — системний helpOnSettings)
  function helpOnSettingsVal(){ return descMode()!=='off'; }
  function renderSettings(){
    renderSettabs();
    setlist.innerHTML=''; setRows=[];
    var showDesc=helpOnSettingsVal(); setlist.classList.toggle('descall', descMode()==='all');
    var cat=SETTINGS_CATS[setCatIdx], advN=0;
    function addMore(){
      var row=document.createElement('div'); row.className='setrow setmore'; var ri=setRows.length;
      row.innerHTML='<div><div class="setlabel">'+(cat.showAdv?L('Сховати додаткові'):L('Додатково'))+'</div>'+(showDesc?'<div class="setdesc">'+advN+L(' рідко потрібних пунктів</div>'):'')+'</div><div class="setpill val">'+(cat.showAdv?'˄':advN+' ˅')+'</div>';
      row.addEventListener('click', function(){ setFocus=ri; markSet(); actRow(ri); });
      row.addEventListener('mouseenter', function(){ if(setFocus!==ri){ setFocus=ri; markSet(true); } });
      setlist.appendChild(row); setRows.push({ more:true, el:row });
    }
    cat.items.forEach(function(it){ if(it.adv) advN++; });
    if(cat.id==='picture' && picDim){ var pd=document.createElement('div'); pd.className='setdim'; pd.textContent=picDimText()+L(' — зміни стосуються лише цього входу й режиму'); setlist.appendChild(pd); }
    var moreDone=false;
    cat.items.forEach(function(it){
      if(it.adv && !moreDone){ moreDone=true; addMore(); }
      if(it.adv && !cat.showAdv) return;
      if(it.hid) return;   // поле таймера — редагується у вікні свого рядка «… за розкладом»
      if(it.sec){ var h=document.createElement('div'); h.className='setsec'; h.textContent=it.sec; setlist.appendChild(h); }
      var idx=setRows.length;
      var isTog=(it.t==='onoff'||it.t==='bool'||it.t==='truefalse');
      var row=document.createElement('div'); row.className='setrow';
      var left=document.createElement('div'); var lab=document.createElement('div'); lab.className='setlabel'; lab.textContent=it.label; left.appendChild(lab);
      if(showDesc && it.d){ var dd=document.createElement('div'); dd.className='setdesc'; dd.textContent=it.d;  left.appendChild(dd); }
      var pill=document.createElement('div');
      if(isTog && it._val===undefined){ pill.className='setpill val'; pill.textContent='…'; }   // ще не прочитано з ТВ
      else if(it.t==='bind'){ var bv=kbDisp(kbVal(it.bk)); pill.className='setpill '+(bv?'val':'off'); pill.textContent=bv||(it.bk.charAt(0)==='m'?'—':L('Стандартно')); }
      else if(it.t==='learn'){ pill.className='setpill val'; pill.textContent='OK'; }
      else if(it.t==='timer'){ var ts=timerSummary(it.tg); pill.className='setpill '+(ts.on?'val':'off'); pill.textContent=ts.text; }
      else if(isTog){ var on=sIsOn(it,it._val); pill.className='setpill '+(on?'on':'off'); pill.textContent=on?L('УВІМК'):L('ВИМК'); }
      else { pill.className='setpill val'; pill.textContent=sDisp(it,it._val); }

      { label:L('🔌  Вимкнути'), action:function(){ run('luna://com.webos.service.tvpower/power2/powerOff', {reason:'remoteKey'}); }},
      { label:L('🌙  Вимкнути екран (звук грає)'), action:function(){ run('luna://com.webos.service.tvpower/power/turnOffScreen', {}); }},
      { label:L('🔄  Перезавантажити'), action:function(){ run('luna://com.webos.service.micomservice/requestAutoPowerOffOn', {second:7, reason:'autoWholeChipReset'}); }},
      { label:L('Скасувати'), action:function(){ closeModal(); if(back) launchId(back); }}

      devs.forEach(function(d){
        if(!d || !d.appId) return;
        var dev=''; (d.subList||[]).forEach(function(s){ if(!dev && s && s.osdName) dev=s.osdName; });
        var lbl=(d.activate?'▶  ':'')+(d.label||d.id)+(dev?('  ·  '+dev):'')+(d.hdmiPlugIn?'':L('  (не підключено)'));

  // ---------- заставка-слайдшоу (простій і наш) ----------
  (function(){

    // кроки синхронні (≈20/с): плавно, без «драбинки», а композитор перемальовує кадр лише 20 разів/с.
    var DVD_VX=70, DVD_VY=52, DVD_T=240;
    function startDvd(){ if(!clk||!clkIn) return; stopDvd(); if(!DVD) return;
      var DVD_FPS=30;   // 30 кроків/с ≈34% CPU — користувач: «супер плавно» (60 кадрів ≈65% CPU — прибрано)   // 0 = linear (60 кадрів)
      var w=window.innerWidth||1920, h=window.innerHeight||1080, cw=clkIn.offsetWidth||420, ch=clkIn.offsetHeight||190;
      var mx=Math.max(1,w-cw), my=Math.max(1,h-ch);

      while(t<DVD_T){
        var tx = vx>0 ? (mx-x)/vx : -x/vx, ty = vy>0 ? (my-y)/vy : -y/vy, dt=Math.min(tx,ty,DVD_T-t);

  // ---------- курсор пішов з об'єкта → виділення зникає (скрізь: хаб, налаштування, пошук, меню) ----------
