<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Браузер</title>
<style>
  :root { --bg:#070708; --bar:#101014; --card:#18181d; --card2:#22222a; --txt:#f2f2f5; --dim:#8a8a96; --acc:#0ea5a4;
    --tab:#16161b; --field:#0d0d11; --line:#1f1f26; --txt2:#c9c9d2; --nbt:#d6d6dd; --foc:#fff; --hov:#30303a; --pop:#16161c; --ic:#0d0d10; --txbg:#2c2c36; }
  body.light { --bg:#f2f3f6; --bar:#ffffff; --card:#ffffff; --card2:#e9ecf1; --txt:#15161a; --dim:#6b6f7a;
    --tab:#e6e9ee; --field:#eef0f4; --line:#d9dde4; --txt2:#3a3d45; --nbt:#2a2d35; --foc:#15161a; --hov:#d5dae2; --pop:#ffffff; --ic:#eef0f4; --txbg:#dfe3e9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--txt);
    font-family:"LG Smart UI","Museo Sans",Roboto,Arial,sans-serif; }
  input { font-family:inherit; }
  /* ---- top bar ---- */
  #bar { position:absolute; left:0; top:0; right:0; height:136px; background:var(--bar); border-bottom:1px solid var(--line); z-index:5; }
  #tabs { display:flex; gap:8px; padding:10px 16px 0; height:62px; overflow:hidden; }
  .tab { flex:0 1 300px; min-width:120px; height:52px; border-radius:14px 14px 0 0; background:var(--tab); display:flex; align-items:center;
    gap:10px; padding:0 12px 0 14px; border:3px solid transparent; border-bottom:none; cursor:pointer; position:relative; }
  .tab.act { background:var(--card2); }
  .tab .fi { width:24px; height:24px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--dim); overflow:hidden; }
  .tab .fi img { width:22px; height:22px; }
  .tab .tt { font-size:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; color:var(--txt2); }
  .tab.act .tt { color:var(--txt); }
  .tab .x { font-size:20px; color:var(--dim); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .tab .x:hover { background:var(--hov); color:var(--txt); }
  .tab.load .fi::after { content:''; position:absolute; left:14px; top:12px; width:22px; height:22px; border:3px solid var(--acc); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #newtab { flex:0 0 52px; height:52px; border-radius:14px; background:var(--tab); display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--txt2); border:3px solid transparent; cursor:pointer; }
  #nav { display:flex; align-items:center; gap:10px; height:74px; padding:0 16px; background:var(--card2); }
  .nb { width:58px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--nbt); border:3px solid transparent; cursor:pointer; flex-shrink:0; }
  .nb svg { width:28px; height:28px; }
  .nb.off { opacity:.35; }
  .fw { flex:1; position:relative; display:flex; }
  #addr { flex:1; height:54px; border-radius:27px; background:var(--field); border:3px solid transparent; color:var(--txt); font-size:24px; padding:0 64px 0 26px; outline:none; }
  .gob { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:44px; height:42px; border-radius:21px; border:0 !important;
    display:flex; align-items:center; justify-content:center; color:var(--txt); opacity:.45; cursor:pointer; }
  .gob svg { width:26px; height:26px; }
  .gob:hover, .gob.focus { opacity:1; background:var(--hov); }
  #star.on { color:#facc15; }
  .focus, #addr.focus, #addr:focus, #sq:focus { border-color:var(--foc) !important; }
  .tab.focus, #newtab.focus, .nb.focus { background:var(--hov); }
  #bar.flash { animation:barfl .9s ease; } @keyframes barfl { 0%,60% { background:var(--hov); } 100% { background:var(--bar); } }
  /* settings */
  #setp { position:absolute; right:16px; top:140px; width:640px; background:var(--pop); color:var(--txt); border:1px solid var(--line); border-radius:22px; padding:18px; z-index:30; display:none; box-shadow:0 24px 70px rgba(0,0,0,.7); }
  #setp.show { display:block; }
  #setbg { position:fixed; inset:0; z-index:29; display:none; } #setbg.show { display:block; }   /* click outside the panel (also over a site frame) closes it */
  #setp h3 { font-size:26px; font-weight:600; margin:4px 8px 12px; }
  .si { display:flex; align-items:center; justify-content:space-between; gap:16px; height:68px; padding:0 18px; border-radius:14px; font-size:23px; border:3px solid transparent; cursor:pointer; }
  .si .v { display:flex; align-items:center; gap:14px; color:var(--txt); }
  .si .v b { min-width:120px; text-align:center; font-weight:600; }
  .si .ar { color:var(--dim); font-size:30px; padding:0 8px; }
  .si.focus { background:var(--hov); }
  .si.info { color:var(--dim); font-size:19px; height:auto; padding:10px 18px; line-height:1.4; cursor:default; }
  /* ---- content ---- */
  #content { position:absolute; left:0; right:0; top:136px; bottom:0; overflow:hidden; background:var(--bg); }
  #content.start { background:var(--bg); }
  iframe.site { position:absolute; left:0; top:0; border:0; background:#fff; transform-origin:0 0; visibility:hidden; }
  iframe.site.act { visibility:visible; }
  body.full #bar { display:none; } body.full #content { top:0; }
  /* ---- start page ---- */
  #start { position:absolute; inset:0; overflow:hidden; padding:34px 70px; display:none; background:var(--bg); }
  #start.show { display:block; }
  #sqrow { position:relative; display:flex; width:1180px; margin:6px auto 4px; }
  #sq { flex:1; height:88px; border-radius:44px; background:var(--card); border:3px solid transparent;
    color:var(--txt); font-size:32px; padding:0 96px 0 40px; outline:none; }
  #go2 { right:12px; width:68px; height:64px; border-radius:32px; }
  #go2 svg { width:34px; height:34px; }
  #shint { text-align:center; font-size:19px; color:var(--dim); margin-bottom:4px; }
  h2 { font-size:26px; font-weight:500; color:var(--txt2); margin:22px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:18px; }
  .tile { height:100px; border-radius:20px; background:var(--card); display:flex; align-items:center; gap:16px; padding:0 18px; border:3px solid transparent; cursor:pointer; min-width:0; }
  .tile .ic { width:56px; height:56px; border-radius:14px; background:var(--ic); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:26px; color:var(--dim); }
  .tile .ic img { width:34px; height:34px; }
  .tile .t { min-width:0; } .tile .n { font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .h { font-size:17px; color:var(--dim); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile { position:relative; }
  .tile .tx { position:absolute; right:10px; top:50%; margin-top:-20px; width:40px; height:40px; border-radius:12px; display:none; align-items:center; justify-content:center; font-size:22px; color:var(--txt2); background:var(--txbg); }
  .tile .tx:hover { background:#e11d2a; color:#fff; }
  .tile.focus .tx, .tile:hover .tx { display:flex; }
  .tile.focus .t, .tile:hover .t { padding-right:44px; }
  .tile.focus, .tile:hover { border-color:var(--foc); background:var(--card2); }
  .empty { font-size:21px; color:var(--dim); }
  #keys { position:absolute; left:70px; right:70px; bottom:20px; font-size:19px; color:var(--dim); }
  #keys .kl { display:flex; gap:26px; flex-wrap:wrap; margin-top:8px; }
  #keys b { color:var(--txt2); font-weight:600; }
  .dot { display:inline-block; width:16px; height:16px; border-radius:50%; vertical-align:-2px; margin-right:7px; }
  #toast { position:absolute; left:50%; top:160px; transform:translateX(-50%); background:var(--pop); color:var(--txt); border:1px solid var(--line); border-radius:22px; padding:18px 30px; font-size:24px; display:none; z-index:20; }
  #msg { position:absolute; left:0; right:0; top:42%; text-align:center; font-size:28px; color:var(--dim); display:none; }
</style>
</head>
