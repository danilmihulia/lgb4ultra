<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<title>Файли</title>
<style>
  :root { --accent:#e11d2a; --bg:#070708; --panel:#121216; --row:#18181e; --muted:#8a8a93; --dim:#55555d;
    --ease:cubic-bezier(.22,.61,.24,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:#fff;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  svg { width:100%; height:100%; display:block; }
  .page { position:absolute; inset:0; padding:32px 40px 0; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:24px; height:72px; flex:0 0 auto; }
  header .ttl { font-size:40px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:14px; }
  header .ttl i { width:44px; height:44px; color:var(--accent); }
  header .crumb { flex:1; font-size:22px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
  header .crumb b { color:#fff; font-weight:600; }
  header .space { font-size:19px; color:var(--dim); white-space:nowrap; }
  .body { flex:1; display:flex; gap:28px; min-height:0; padding:18px 0 0; }

  /* places */
  .side { width:360px; flex:0 0 360px; display:flex; flex-direction:column; gap:10px; }
  .side h3 { font-size:17px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; margin:10px 6px 2px; }
  .place { display:flex; align-items:center; gap:16px; height:74px; padding:0 18px; border-radius:16px; background:var(--panel);
    cursor:pointer; transition:transform .16s var(--ease), box-shadow .16s var(--ease), background .16s; }
  .place i { width:36px; height:36px; flex:0 0 36px; color:#cfcfd6; }
  .place .pn { flex:1; min-width:0; }
  .place .pn div:first-child { font-size:23px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .place .pn div:last-child { font-size:16px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .place.sel { background:#1f1f27; }
  .place.sel i { color:var(--accent); }
  .place.off { opacity:.45; }
  .focus { box-shadow:0 0 0 3px #fff, 0 12px 30px rgba(0,0,0,.5) !important; transform:scale(1.02); z-index:2; position:relative; }

  /* list */
  .listwrap { flex:1; min-width:0; display:flex; flex-direction:column; }
  .listhead { display:flex; font-size:16px; color:var(--dim); text-transform:uppercase; letter-spacing:1.2px; padding:0 20px 10px 86px; }
  .listhead .c1 { flex:1; } .listhead .c2 { width:150px; text-align:right; } .listhead .c3 { width:230px; text-align:right; }
  .list { flex:1; overflow:hidden; position:relative; padding:6px 8px; margin:0 -8px; }
  .rows { position:relative; transition:transform .18s var(--ease); }
  .row { display:flex; align-items:center; height:64px; padding:0 20px; border-radius:12px; margin-bottom:6px; background:var(--row); font-size:22px;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), background .14s; cursor:pointer; }
  .row i { width:34px; height:34px; flex:0 0 34px; margin-right:12px; color:#b9b9c2; }
  .row .mk { width:20px; flex:0 0 20px; margin-right:12px; height:20px; border-radius:6px; border:2px solid #3a3a44; }
  .row.marked .mk { background:var(--accent); border-color:var(--accent); }
  .row.marked { background:#2a1517; }
  .row .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .nm small { color:var(--dim); font-size:16px; margin-left:12px; }
  .row .sz { width:150px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:19px; }
  .row .dt { width:230px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; font-size:19px; }
  .row.dir i { color:#e8b04a; } .row.img i { color:#5fb0ff; }
  .row.focus { background:#2a2a33; transform:scale(1.01); }
  .empty { color:var(--muted); font-size:26px; padding:60px 20px; text-align:center; }

  /* preview pane */
  .pane { width:520px; flex:0 0 520px; display:flex; flex-direction:column; gap:14px; }
  .thumb { height:300px; border-radius:16px; background:var(--panel) center/contain no-repeat; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { max-width:100%; max-height:100%; object-fit:contain; opacity:0; transition:opacity .25s; }
  .thumb img.ok { opacity:1; }
  .thumb i { width:120px; height:120px; color:#2c2c35; }
  .meta { font-size:19px; color:var(--muted); line-height:1.6; word-break:break-all; }
  .meta b { color:#fff; font-size:22px; display:block; margin-bottom:4px; word-break:break-all; }
  .lock { display:inline-flex; align-items:center; gap:8px; font-size:17px; color:#c9a14a; background:#2a2414; padding:6px 12px; border-radius:10px; }

  /* footer: colour-button legend (also clickable with the Magic Remote pointer) */
  footer { flex:0 0 86px; display:flex; align-items:center; gap:14px; }
  .key { display:flex; align-items:center; gap:10px; height:50px; padding:0 18px; border-radius:12px; background:var(--panel); font-size:19px; color:#d6d6dc; cursor:pointer; }
  .key.dis { opacity:.3; }
  .key s { width:18px; height:18px; border-radius:50%; display:inline-block; text-decoration:none; }
  .key .r { background:#e5323c; } .key .g { background:#2fb653; } .key .y { background:#e8c13a; } .key .b { background:#3b82f6; }
  .key kbd { font:inherit; font-size:16px; padding:3px 8px; border-radius:6px; background:#26262e; color:#fff; }
  footer .sp { flex:1; }
  footer .info { font-size:19px; color:var(--muted); }

  /* fullscreen preview */
  #pv { position:fixed; inset:0; background:#000; display:none; z-index:20; }
  #pv.on { display:block; }
  #pv img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #pv .bar { position:absolute; left:0; right:0; bottom:0; padding:28px 48px 34px; display:flex; align-items:flex-end; gap:24px;
    background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); transition:opacity .35s; }
  #pv.hide .bar, #pv.hide .nav { opacity:0; }
  #pv .bar .t { flex:1; min-width:0; }
  #pv .bar .t b { display:block; font-size:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pv .bar .t span { font-size:19px; color:#aaa; }
  #pv .nav { position:absolute; top:50%; margin-top:-40px; width:80px; height:80px; border-radius:50%; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; font-size:46px; color:#fff; cursor:pointer; transition:opacity .35s; }
  #pv .nav.l { left:30px; } #pv .nav.r { right:30px; }
  #pv .spin { position:absolute; left:50%; top:50%; margin:-14px; width:28px; height:28px; border-radius:50%; border:3px solid #444; border-top-color:#fff; animation:sp 1s linear infinite; display:none; }
  #pv.loading .spin { display:block; }
  @keyframes sp { to { transform:rotate(360deg); } }

  .row.vid i { color:#c58cff; } .row.aud i { color:#3ccf9a; }
  .row .nm small.where { color:#6d6d78; }

  /* video player */
  #vp { position:fixed; inset:0; background:#000; display:none; z-index:22; }
  #vp.on { display:block; }
  #vp video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #vp .ov { position:absolute; left:0; right:0; bottom:0; padding:90px 60px 40px; background:linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0)); transition:opacity .35s; }
  #vp .top { position:absolute; left:0; right:0; top:0; padding:36px 60px 80px; background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0)); transition:opacity .35s; font-size:30px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #vp .top span { display:block; font-size:19px; font-weight:400; color:#aaa; margin-top:6px; }
  #vp.hide .ov, #vp.hide .top { opacity:0; }
  #vp.hide { cursor:none; }
  .prog { position:relative; height:10px; border-radius:5px; background:rgba(255,255,255,.22); cursor:pointer; }
  .prog .buf { position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:rgba(255,255,255,.28); }
  .prog .cur { position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--accent); }
  .prog .knob { position:absolute; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(225,29,42,.45); }
  .ctl { display:flex; align-items:center; gap:18px; margin-top:22px; font-size:22px; color:#ddd; }
  .ctl .pp { width:64px; height:64px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 64px; }
  .ctl .pp svg { width:30px; height:30px; }
  .ctl .tm { font-variant-numeric:tabular-nums; font-size:24px; }
  .ctl .sp { flex:1; }
  .ctl .hint { font-size:18px; color:#9a9aa3; }
  .ctl .hint kbd { font:inherit; font-size:16px; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.14); color:#fff; margin:0 4px 0 12px; }
  #vp .osd { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-size:44px; font-weight:700; background:rgba(0,0,0,.55); padding:18px 34px; border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none; font-variant-numeric:tabular-nums; }
  #vp .osd.on { opacity:1; }
  #vp .err { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1100px; text-align:center; font-size:28px; line-height:1.5; color:#ddd; display:none; }
  #vp .err small { display:block; font-size:20px; color:#999; margin-top:12px; }
  #vp.failed .err { display:block; }
  #vp .spin { position:absolute; left:50%; top:50%; margin:-20px; width:40px; height:40px; border-radius:50%; border:4px solid #444; border-top-color:#fff; animation:sp 1s linear infinite; display:none; }
  #vp.loading .spin { display:block; }

  /* audio player */
  #ap { position:fixed; inset:0; background:radial-gradient(1200px 700px at 20% 20%, #1a1420, #070708); display:none; z-index:22; padding:70px 90px 60px; }
  #ap.on { display:flex; gap:70px; }
  #ap .art { width:560px; flex:0 0 560px; display:flex; flex-direction:column; justify-content:center; }
  #ap .disc { width:420px; height:420px; border-radius:50%; background:conic-gradient(from 0deg, #2a1d30, #121218, #2a1d30, #121218, #2a1d30); box-shadow:0 30px 80px rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; margin-bottom:46px; }
  #ap .disc i { width:110px; height:110px; color:var(--accent); display:block; }
  #ap.playing .disc { animation:sp 6s linear infinite; }
  #ap .tt { font-size:36px; font-weight:700; line-height:1.25; word-break:break-word; max-height:136px; overflow:hidden; }
  #ap .ts { font-size:21px; color:var(--muted); margin:12px 0 30px; }
  #ap .pl { flex:1; min-width:0; display:flex; flex-direction:column; }
  #ap .pl h3 { font-size:17px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 14px 6px; }
  #ap .plist { flex:1; overflow:hidden; position:relative; }
  #ap .plrows { transition:transform .18s var(--ease); }
  #ap .tr { display:flex; align-items:center; gap:16px; height:60px; padding:0 20px; border-radius:12px; margin-bottom:6px; font-size:22px; color:#cfcfd6; cursor:pointer; }
  #ap .tr .n { width:44px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right; }
  #ap .tr .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ap .tr .sz { color:var(--dim); font-size:18px; }
  #ap .tr.cur { background:#2a1517; color:#fff; } #ap .tr.cur .n { color:var(--accent); }
  #ap .tr.tf { box-shadow:inset 0 0 0 3px #fff; }
  #ap .hint2 { font-size:18px; color:#8a8a93; margin-top:18px; }
  #ap .hint2 kbd { font:inherit; font-size:16px; padding:3px 8px; border-radius:6px; background:#26262e; color:#fff; margin:0 4px 0 14px; }
  #ap .hint2 kbd:first-child { margin-left:0; }

  /* search input dialog */
  .dlg input { width:100%; height:68px; border-radius:14px; border:2px solid #33333d; background:#0d0d11; color:#fff; font-size:26px; padding:0 20px; margin-bottom:26px; outline:none; }
  .dlg input:focus { border-color:#fff; }

  /* dialogs / menus */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:40; }
  #modal.on { display:flex; }
  .dlg { width:820px; background:#17171d; border-radius:22px; padding:40px 44px 36px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .dlg h2 { font-size:32px; margin-bottom:14px; }
  .dlg p { font-size:22px; color:#c3c3ca; line-height:1.5; margin-bottom:30px; white-space:pre-line; word-break:break-word; }
  .dlg .btns { display:flex; gap:16px; flex-wrap:wrap; }
  .dlg .btns.col { flex-direction:column; }
  .btn { height:64px; padding:0 30px; border-radius:14px; background:#26262e; font-size:23px; font-weight:600; display:flex; align-items:center; cursor:pointer;
    transition:transform .14s var(--ease), box-shadow .14s var(--ease); }
  .btn.danger { background:#5b1419; color:#ffd7d9; }
  .btn.focus { background:#fff; color:#000; }
  .btn.danger.focus { background:var(--accent); color:#fff; }

  #toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%) translateY(20px); background:#26262e; color:#fff; font-size:22px;
    padding:18px 30px; border-radius:16px; opacity:0; transition:opacity .25s, transform .25s; z-index:60; max-width:1400px; text-align:center; pointer-events:none; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #boot { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:80; font-size:26px; color:var(--muted); }
  #boot.off { display:none; }
  #boot .spin2 { width:46px; height:46px; border-radius:50%; border:4px solid #333; border-top-color:var(--accent); animation:sp 1s linear infinite; }
  #boot.err .spin2 { display:none; }
  #boot small { font-size:19px; color:var(--dim); max-width:1100px; text-align:center; line-height:1.5; }
  /* наша екранна клавіатура */
  .osk { position:fixed; left:50%; bottom:28px; transform:translate(-50%,30px); width:1560px; max-width:calc(100% - 80px); padding:18px; border-radius:26px;
         background:rgba(22,22,28,.98); border:1px solid rgba(255,255,255,.14); box-shadow:0 24px 60px rgba(0,0,0,.7); z-index:60;
         opacity:0; pointer-events:none; transition:opacity .16s ease, transform .2s cubic-bezier(.22,.61,.24,1); }
  .osk.show { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .osk-row { display:flex; gap:10px; margin-top:10px; } .osk-row:first-child { margin-top:0; }
  .osk-key { flex:1 1 0; height:74px; border-radius:14px; background:#2a2a33; color:#eee; font-size:32px; font-weight:500; display:flex; align-items:center; justify-content:center;
             cursor:pointer; transition:transform .1s, background .1s, box-shadow .1s; user-select:none; }
  .osk-key.fn { background:#1d1d24; font-size:24px; color:#cfcfd6; }
  .osk-key.ok { background:var(--accent); color:#fff; }
  .osk-key.on { background:#3b3b48; color:#fff; }
  .osk-key.focus { background:#fff; color:#111; transform:scale(1.07); box-shadow:0 8px 22px rgba(0,0,0,.5); }
  .osk-key.ok.focus { background:#fff; color:var(--accent); }
  .osk-hint { display:flex; gap:30px; justify-content:center; margin-top:14px; font-size:20px; color:#b9b9c2; }
  .osk-hint span { display:flex; align-items:center; gap:9px; } .osk-hint span.dim { color:#77777f; }
  .osk-hint span.flash { color:#fff; animation:oskfl .7s ease 3; } @keyframes oskfl { 50% { transform:scale(1.18); } }
  .osk-hint i { width:16px; height:16px; border-radius:50%; display:inline-block; }
  .osk-key svg { width:40px; height:28px; flex:0 0 auto; }
  .osk-key.caps { background:#fff; color:#111; }
  .osk-view { position:fixed; z-index:61; pointer-events:none; display:none; align-items:center; overflow:hidden; color:#fff; white-space:pre; box-sizing:border-box; }
  .osk-tx { display:inline-block; white-space:pre; }
  .osk-caret { display:inline-block; width:3px; height:1.15em; background:#fff; vertical-align:middle; margin:0 1px; animation:oskb 1s steps(1) infinite; }
  @keyframes oskb { 50% { opacity:0; } }
  .osk-target { border-color:#fff !important; box-shadow:0 0 0 3px rgba(255,255,255,.25); }
  body.osk-on #modal { align-items:flex-start; padding-top:110px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="ttl"><i id="appico"></i>Файли</div>
    <div class="crumb" id="crumb"></div>
    <div class="space" id="space"></div>
  </header>
  <div class="body">
    <div class="side" id="side"></div>
    <div class="listwrap">
      <div class="listhead"><div class="c1">Назва</div><div class="c2">Розмір</div><div class="c3">Змінено</div></div>
      <div class="list" id="list"><div class="rows" id="rows"></div></div>
    </div>
    <div class="pane">
      <div class="thumb" id="thumb"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <footer id="footer"></footer>
</div>

<div id="pv"><img id="pvimg" alt=""><div class="spin"></div>
  <div class="nav l" data-act="prev">‹</div><div class="nav r" data-act="next">›</div>
  <div class="bar"><div class="t"><b id="pvname"></b><span id="pvinfo"></span></div><div id="pvkeys" style="display:flex;gap:12px"></div></div>
</div>
<div id="vp"><video id="vpv" preload="auto"></video><div class="spin"></div>
  <div class="err" id="vperr"></div>
  <div class="top" id="vptop"></div>
  <div class="osd" id="vposd"></div>
  <div class="ov">
    <div class="prog" id="vpprog"><div class="buf"></div><div class="cur"></div><div class="knob"></div></div>
    <div class="ctl"><div class="pp" data-act="vpp" id="vppp"></div><div class="tm" id="vptm">0:00 / 0:00</div><div class="sp"></div>
      <div class="hint"><kbd>OK</kbd>пауза<kbd>◀ ▶</kbd>±10 с<kbd>▲ ▼</kbd>±1 хв<kbd>CH ±</kbd>інше відео<kbd>BACK</kbd>закрити</div></div>
  </div>
</div>
<div id="ap"><audio id="apa" preload="auto"></audio>
  <div class="art"><div class="disc"><i id="apico"></i></div><div class="tt" id="aptt"></div><div class="ts" id="apts"></div>
    <div class="prog" id="approg"><div class="buf"></div><div class="cur"></div><div class="knob"></div></div>
    <div class="ctl"><div class="pp" data-act="app" id="appp"></div><div class="tm" id="aptm">0:00 / 0:00</div></div>
  </div>
  <div class="pl"><h3 id="aph"></h3><div class="plist" id="aplist"><div class="plrows" id="aprows"></div></div>
    <div class="hint2"><kbd>OK</kbd>пауза / грати вибраний<kbd>▲ ▼</kbd>список<kbd>◀ ▶</kbd>±10 с<kbd>CH ±</kbd>трек<kbd>BACK</kbd>закрити</div></div>
</div>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<div id="boot"><div class="spin2"></div><div id="bootmsg">Запускаю службу файлів…</div><small id="bootsub"></small></div>

<script>
  // ---- interface language (chosen in the hub: settings category "myhome", key "uiLang"). Dictionary keys = Ukrainian text;
  // L(s) = translation or s. Translations: i18n/<lang>.json next to this page (source: i18n/<app>/ in the project).
  // our apps may NOT read settings (settingsservice → Access denied for com.user.*), so a root daemon on the TV
  // (deploy/poweron/poweron-home.sh) writes the hub's choice into i18n/current.json next to each app
  function curLang(){ try{ var x=new XMLHttpRequest(); x.open('GET','i18n/current.json',false); x.send(); return (JSON.parse(x.responseText)||{}).lang||null; }catch(e){ return null; } }
  var UILANG=(function(){ var c=curLang(); if(c){ try{ localStorage.setItem('uiLang',c); }catch(e){} return c; } try{ return localStorage.getItem('uiLang')||'uk'; }catch(e){ return 'uk'; } })(), DICT=null;
  if(UILANG!=='uk'){ try{ var lx=new XMLHttpRequest(); lx.open('GET','i18n/'+UILANG+'.json',false); lx.send(); if(lx.responseText) DICT=JSON.parse(lx.responseText); }catch(e){ DICT=null; } }
  function L(s){ return (DICT && DICT[s]) || s; }
  (function(){ if(!DICT || !document.body) return; document.documentElement.lang=UILANG;
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false), n, list=[];
    while((n=w.nextNode())) list.push(n);
    list.forEach(function(t){ var v=t.nodeValue, k=v.replace(/\s+/g,' ').trim(); if(k && DICT[k]) t.nodeValue=v.replace(k, DICT[k]); });

// ---------- launch params: {"search":"…"} | {"path":"/…"} | {"probe":"/dir"} ----------
function launchParams() { try { var p = window.PalmSystem && PalmSystem.launchParams; return typeof p === 'string' ? JSON.parse(p || '{}') : (p || {}); } catch (e) { return {}; } }

}
function handleParams(p) {
  p = p || {};

  if (typeof p.path === 'string' && p.path.charAt(0) === '/') { closeOverlays(); return openTarget(p.path).then(function () { return true; }); }
  if (p.usb) { closeOverlays(); return openUsb().then(function () { return true; }); }

}

        var pl = S.places.filter(function (x) { return x.icon === 'usb' && !x.off; })[0];
        if (pl) { S.zone = 'list'; openPath(pl.path).then(res, res); }
        else if (Date.now() - t0 > 8000) { toast(L('Флешку не знайдено')); openPath(S.places[0].path).then(res, res); }
        else setTimeout(poll, 700);
      }, function () { setTimeout(poll, 700); });
    })();
  });
}
function openTarget(p) {
  return api('GET', '/api/list?path=' + encodeURIComponent(p)).then(function () { S.zone = 'list'; return openPath(p); }, function () {
    var name = p.slice(p.lastIndexOf('/') + 1);
    return openPath(dirOf(p), name).then(function () { S.zone = 'list'; if (S.entries[S.idx] && S.entries[S.idx].name === name) activate(); });
  });
}

// Dev aid: plays every media file in a folder for a few seconds and logs what the web media stack managed (to /tmp/explorer-client.log).
function runProbe(dir) {
  api('GET', '/api/list?path=' + encodeURIComponent(dir)).then(function (d) {
    var files = d.entries.filter(function (e) { return e.kind === 'video' || e.kind === 'audio'; }), i = 0;
    var v = $('vpv'); $('vp').classList.add('on'); S.zone = 'probe';
    api('POST', '/api/log', { probe:'start', dir:dir, n:files.length, canPlay:['video/mp4','video/x-matroska','video/webm','video/mp2t','video/x-msvideo','audio/mpeg','audio/flac','audio/ogg','audio/mp4','audio/wav'].map(function (m) { return m + '=' + v.canPlayType(m); }) });
    (function next() {
      if (i >= files.length) { stopMedia(v); $('vp').classList.remove('on'); S.zone = 'list'; api('POST', '/api/log', { probe:'end' }); toast(L('Перевірку завершено')); return; }
      var f = files[i++], p = (dir === '/' ? '' : dir) + '/' + f.name, srcs = mediaSrcs(p), k = 0, t0, done = false;
      $('vptop').innerHTML = esc(f.name) + L('<span>перевірка ') + i + ' / ' + files.length + '</span>';
      function finish(res) { if (done) return; done = true; clearTimeout(to); res.name = f.name; res.size = f.size; api('POST', '/api/log', res).then(function () {}, function () {}).then(function () { stopMedia(v); setTimeout(next, 600); }); }
      function attempt() {
        if (k >= srcs.length) return finish({ ok:false, err:v.error ? v.error.code : null, tried:k });
        var s = srcs[k++]; t0 = Date.now();
        v.onerror = function () { attempt(); };
        v.onplaying = function () { var st = v.currentTime; setTimeout(function () { finish({ ok:v.currentTime > st + 0.5, how:s.how, w:v.videoWidth, h:v.videoHeight, dur:Math.round(v.duration), adv:+(v.currentTime - st).toFixed(2), ms:Date.now() - t0 }); }, 2500); };
        v.src = s.url; v.load(); var pr = v.play(); if (pr && pr.catch) pr.catch(function () {});
      }
      var to = setTimeout(function () { finish({ ok:false, timeout:true, how:srcs[k - 1] && srcs[k - 1].how, w:v.videoWidth, rs:v.readyState, ns:v.networkState }); }, 15000);
      attempt();
    })();
  }).catch(function (e) { toast('probe: ' + e.message); });
}

// ---------- navigation ----------
function activate() {
  var e = S.entries[S.idx]; if (!e) return;
  if (e.type === 'dir') { if (S.view === 'trash') toast(L('Зелена кнопка — відновити')); else openPath(e.path); return; }
  if (e.image) pvOpen();
  else if (e.kind === 'video') vpOpen();
  else if (e.kind === 'audio') apOpen();
  else toast(S.view === 'trash' ? L('Зелена кнопка — відновити') : L('Відкриваються зображення, відео та аудіо'));
}
function goBack() {
  if (Object.keys(S.marked).length) { S.marked = {}; renderAll(); return; }
  if (S.zone === 'side') { closeApp(); return; }
  if (S.view === 'search') { var back = S.searchBack; S.searchBack = null; openPath(back || S.places[0].path); return; }
  if (S.view === 'fs' && S.data && S.data.parent) {
    var cur = S.path, place = S.places.filter(function (pl) { return pl.path === cur; })[0];
    if (!place) { openPath(S.data.parent, cur.slice(cur.lastIndexOf('/') + 1)); return; }
  }
  S.zone = 'side'; renderAll();
}
// Back on the side panel → LG's own exit question (restyled by our hook 37), the same as in every other app (user's wish:
// no separate «Закрити «Файли»?» dialog). The file service is stopped when the page really goes away.
function closeApp() {
  try { if (window.webOSSystem && webOSSystem.platformBack) { webOSSystem.platformBack(); return; } } catch (e) {}
  try { window.close(); } catch (e) {}
}
window.addEventListener('pagehide', function () { try { navigator.sendBeacon(API + '/api/quit', ''); } catch (e) {} });
function openPlace(i) {
  var pl = S.places[i]; if (!pl || pl.off) { if (pl && pl.off) toast(L('Вставте флешку в USB-порт телевізора')); return; }
  S.side = i; S.zone = 'list';
  (pl.view === 'trash' ? openTrash() : openPath(pl.path));
}
// Безпечне виймання флешки: зупинити відтворення з неї, піти з її папок, скинути кеш і відключити через LG.
function ejectPlace(pl) {
  if (S.busy) { toast(L('Зачекайте, триває копіювання…')); return; }
  var onStick = function (p) { return p && (p === pl.path || p.indexOf(pl.path + '/') === 0); };
  try { if (S.zone === 'video') vpClose(); if (S.zone === 'audio') apClose(); } catch (e) {}
  try { var v = $('vpv'); if (v && onStick(decodeURIComponent(String(v.src || '')).replace(/^file:\/\//, ''))) stopMedia(v); } catch (e) {}
  var leave = S.view === 'fs' && onStick(S.path);
  toast(L('Готую «') + pl.title + L('» до виймання…'), 20000);
  return api('POST', '/api/eject', { path:pl.path }).then(function (r) {
    toast('«' + pl.title + L('» можна виймати'), 5000);
    return refreshPlaces().then(function () { if (leave) return openPath(S.places[0].path); renderAll(); });
  }).catch(function (e) { toast(L('Не вдалося: ') + e.message + L('. Закрийте файли з флешки й спробуйте ще раз.'), 6000); });
}

function act(a) {
  if (S.busy && a !== 'back') { toast(L('Зачекайте, триває копіювання…')); return; }
  if (S.zone === 'preview') {
    if (a === 'del') pvDelete();
    else if (a === 'import') { var e = S.pvList[S.pvIdx]; if (e) confirmImport([e]); }
    else if (a === 'restore') { S.idx = S.entries.indexOf(S.pvList[S.pvIdx]); doRestore(); pvClose(); }
    else if (a === 'back') pvClose();
    else if (a === 'prev') pvStep(-1); else if (a === 'next') pvStep(1);
    return;
  }
  if (a === 'del') doDelete();
  else if (a === 'import') { if (canImport()) confirmImport(); else toast(S.data && S.data.isWalls ? L('Це вже папка шпалер') : L('Оберіть зображення')); }
  else if (a === 'restore') doRestore();
  else if (a === 'mark') toggleMark();
  else if (a === 'menu') menu();
  else if (a === 'eject') { var sp = sidePlace(); if (isStick(sp)) ejectPlace(sp); }
  else if (a === 'back') goBack();
}

document.addEventListener('keydown', function (ev) {
  var k = ev.keyCode, handled = true;
  if (k === 8 || k === 27) k = KEY.BACK; // desktop testing
  if (S.zone === 'modal') {
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && k !== KEY.UP && k !== KEY.DOWN && k !== KEY.BACK && k !== 13) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && (k === KEY.UP || k === KEY.DOWN)) document.activeElement.blur();
    var n = S.modal.buttons.length, col = $('dlg').querySelector('.btns.col');
    if (S.modal.f < 0 && (k === KEY.UP || k === KEY.DOWN || k === KEY.LEFT || k === KEY.RIGHT || k === KEY.OK)) { S.modal.f = Math.max(0, Math.min(n - 1, S.modal.last)); paintModal(); ev.preventDefault(); return; }   // спершу повертаємо виділення
    if ((col && k === KEY.UP) || (!col && k === KEY.LEFT)) { S.modal.f = (S.modal.f + n - 1) % n; paintModal(); }
    else if ((col && k === KEY.DOWN) || (!col && k === KEY.RIGHT)) { S.modal.f = (S.modal.f + 1) % n; paintModal(); }
    else if (k === KEY.OK) pressModal(S.modal.f);
    else if (k === KEY.BACK) closeModal();
    ev.preventDefault(); return;
  }
  if (S.zone === 'video') { if (vpKey(k)) ev.preventDefault(); return; }
  if (S.zone === 'audio') { if (apKey(k)) ev.preventDefault(); return; }
  if (S.zone === 'probe') { if (k === KEY.BACK) location.reload(); return; }
  if (S.zone === 'preview') {
    pvWake();
    if (k === KEY.LEFT) pvStep(-1); else if (k === KEY.RIGHT) pvStep(1);
    else if (k === KEY.BACK) pvClose();
    else if (k === KEY.RED) act('del');
    else if (k === KEY.GREEN) act(S.view === 'trash' ? 'restore' : 'import');
    else if (k === KEY.OK) { var p = $('pv'); if (p.classList.contains('hide')) pvWake(); else pvDelete(); }
    else handled = false;
    if (handled) ev.preventDefault(); return;
  }
  if (S.zone === 'side') {
    if (k === KEY.UP && S.side > 0) { S.side--; renderSide(); renderFooter(); }
    else if (k === KEY.DOWN && S.side < S.places.length - 1) { S.side++; renderSide(); renderFooter(); }
    else if (k === KEY.RED && isStick(S.places[S.side])) ejectPlace(S.places[S.side]);
    else if (k === KEY.RIGHT) { S.zone = 'list'; renderAll(); }
    else if (k === KEY.OK) openPlace(S.side);
    else if (k === KEY.BACK) closeApp();
    else handled = false;
    if (handled) ev.preventDefault(); return;
  }
  var prev = S.idx, n2 = S.entries.length;
  if (k === KEY.UP) { if (S.idx > 0) S.idx--; updateFocusRow(prev); }
  else if (k === KEY.DOWN) { if (S.idx < n2 - 1) S.idx++; updateFocusRow(prev); }
  else if (k === KEY.PGUP) { S.idx = Math.max(0, S.idx - 10); updateFocusRow(prev); }
  else if (k === KEY.PGDN) { S.idx = Math.min(n2 - 1, S.idx + 10); updateFocusRow(prev); }
  else if (k === KEY.LEFT) { S.zone = 'side'; S.side = activeSide(); renderAll(); }
  else if (k === KEY.RIGHT) { if (S.entries[S.idx] && S.entries[S.idx].type === 'dir') activate(); }
  else if (k === KEY.OK) activate();
  else if (k === KEY.BACK) act('back');
  else if (k === KEY.RED) act('del');
  else if (k === KEY.GREEN) act(S.view === 'trash' ? 'restore' : 'import');
  else if (k === KEY.YELLOW) act('mark');
  else if (k === KEY.BLUE) act('menu');
  else handled = false;
  if (handled) ev.preventDefault();
});

// Magic Remote pointer / mouse
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-btn],[data-act],[data-side],[data-row],[data-tr],.prog'); if (!t) return;
  if (t.dataset.btn != null) { pressModal(+t.dataset.btn); return; }
  if (S.zone === 'modal') return;
  if (S.zone === 'video') {
    var v = $('vpv'); vpWake();
    if (t.id === 'vpprog' && isFinite(v.duration)) { var r = t.getBoundingClientRect(); v.currentTime = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * v.duration; }
    else if (t.dataset.act === 'vpp') vpToggle();
    return;
  }
  if (S.zone === 'audio') {
    var a = $('apa');
    if (t.id === 'approg' && isFinite(a.duration)) { var r2 = t.getBoundingClientRect(); a.currentTime = Math.max(0, Math.min(1, (ev.clientX - r2.left) / r2.width)) * a.duration; }
    else if (t.dataset.act === 'app') apToggle();
    else if (t.dataset.tr != null) { S.apF = S.apIdx = +t.dataset.tr; apLoad(); }
    return;
  }
  if (t.dataset.act) { act(t.dataset.act); return; }
  if (t.dataset.side != null) { openPlace(+t.dataset.side); return; }
  if (t.dataset.row != null) { var prev = S.idx; S.zone = 'list'; if (S.idx === +t.dataset.row) activate(); else { S.idx = +t.dataset.row; renderSide(); updateFocusRow(prev); } }
});
document.addEventListener('mousemove', function () { if (S.zone === 'preview') pvWake(); else if (S.zone === 'video') vpWake(); });
// меню й діалоги: наведення = виділення, курсор на порожньому місці = виділення зникає (як у хабі)
(function () {
  var lastKey = 0;
  window.addEventListener('keydown', function () { lastKey = Date.now(); }, true);
  document.addEventListener('mousemove', function (ev) {
    if (S.zone !== 'modal' || !S.modal || Date.now() - lastKey < 400) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    var t = ev.target.closest && ev.target.closest('#dlg [data-btn]');
    if (t) { var i = +t.dataset.btn; if (S.modal.f !== i) { S.modal.f = i; S.modal.last = i; paintModal(); } }
    else if (S.modal.f >= 0 && !(ev.target.closest && ev.target.closest('.osk'))) { S.modal.last = S.modal.f; S.modal.f = -1; paintModal(); }
  }, true);
})();
$('vpv').addEventListener('click', function () { if (S.zone === 'video') { if ($('vp').classList.contains('hide')) vpWake(); else vpToggle(); } });
document.addEventListener('wheel', function (ev) { if (S.zone !== 'list') return; var prev = S.idx; S.idx = Math.max(0, Math.min(S.entries.length - 1, S.idx + (ev.deltaY > 0 ? 3 : -3))); updateFocusRow(prev); });

// ---------- boot ----------
$('appico').innerHTML = ICON.app;
ensureServer().then(function () {
  return refreshPlaces().then(function () { return handleParams(launchParams()); }).then(function (used) { if (!used || !S.view || (S.view === 'fs' && !S.path)) return openPath(S.places[0].path); });
}).then(function () {
  $('boot').classList.add('off');
  setTimeout(function () { screenCopies(true); }, 8000);
  setInterval(function () { if (S.zone !== 'modal' && !S.busy) refreshPlaces(true).catch(function () { ensureServer(); }); }, 3000);
}).catch(function (e) {
  var b = $('boot'); b.classList.add('err');
  $('bootmsg').textContent = L('Не вдалося запустити службу файлів');
  $('bootsub').textContent = e.message + L('. Потрібен Homebrew Channel (root). Натисніть OK, щоб спробувати ще раз.');
  document.addEventListener('keydown', function (ev) { if (ev.keyCode === 13) location.reload(); });
});
document.addEventListener('webOSRelaunch', function (ev) {
  if (!S.places.length) return;
  var p = (ev && ev.detail && typeof ev.detail === 'object') ? ev.detail : launchParams();
  refreshPlaces(true).catch(function () {}).then(function () { return handleParams(p); });
});
})();
</script>
</body>
